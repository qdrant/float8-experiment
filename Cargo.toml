[package]
name = "float8"
version = "0.1.0"
edition = "2021"
description = "A project for testing float8 embeddings for KNN search"
authors = ["Andrey Vasnetsov <andrey@vasnetsov.com>"]
license = "Apache-2.0"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
npyz = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"



[dev-dependencies]
criterion = "0.5"

